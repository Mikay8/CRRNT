openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 3.0.0
  description: CRRNT API — personalized news, stocks, and auth
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: stories
  - name: onboarding
  - name: stocks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Request accepted (always returns success to avoid email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a token from the forgot-password email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required: [token, password]
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /auth/send-verification:
    post:
      operationId: sendVerification
      tags: [auth]
      summary: Send an email verification message
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /auth/mark-verified:
    post:
      operationId: markVerified
      tags: [auth]
      summary: Mark the current user's email as verified
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the current user's account and all associated data
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Deleted

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  # ── Stories ───────────────────────────────────────────────────────────────
  /stories/daily:
    get:
      operationId: listStories
      tags: [stories]
      summary: Get personalized daily story feed
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Personalized feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoriesResponse"

  /stories/breaking:
    get:
      operationId: getBreakingNews
      tags: [stories]
      summary: Get active breaking news alert
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Breaking news
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakingNewsResponse"

  /stories/saved:
    get:
      operationId: getSavedStories
      tags: [stories]
      summary: Get user's saved stories
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Saved stories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoriesResponse"

  /stories/search:
    get:
      operationId: searchStories
      tags: [stories]
      summary: Full-text search across active stories
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /stories/{id}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a single story by id
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Story detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stories/{id}/save:
    post:
      operationId: saveStory
      tags: [stories]
      summary: Save a story
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
    delete:
      operationId: unsaveStory
      tags: [stories]
      summary: Remove a saved story
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  # ── Onboarding ────────────────────────────────────────────────────────────
  /onboarding/quiz:
    post:
      operationId: saveOnboardingQuiz
      tags: [onboarding]
      summary: Save onboarding quiz answers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizPayload"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResponse"
    get:
      operationId: getOnboardingQuiz
      tags: [onboarding]
      summary: Get current onboarding preferences
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResponse"

  # ── Stocks ────────────────────────────────────────────────────────────────
  /stock/{ticker}:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Get stock price history
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 5y]
      responses:
        "200":
          description: Stock price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistory"
        "404":
          description: Ticker not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /simulate:
    post:
      operationId: simulateInvestment
      tags: [stocks]
      summary: Simulate a hypothetical investment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResponse"

  /push-token:
    post:
      operationId: registerPushToken
      tags: [health]
      summary: Register Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Category:
      type: string
      enum: [celebrity, tech, government, sports, business, science, entertainment]

    Story:
      type: object
      properties:
        id:
          type: string
        external_id:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        published_at:
          type: string
        source_url:
          type: string
        media_url:
          type: string
          nullable: true
        summary:
          type: string
          description: AI-generated story summary
        life_impact:
          type: string
          description: How this story directly affects the reader's life
        personalized_life_impact:
          type: string
          nullable: true
          description: Life impact rewritten for this user's onboarding preferences, when available
        wallet_impact:
          type: string
          description: Everyday money ripple effect
        stock_note:
          type: string
          nullable: true
          description: Ticker and company context (e.g. "AAPL (Apple)")
        one_liner:
          type: string
          description: Punchy one-line insight
        tts_url:
          type: string
          nullable: true
          description: URL to pre-generated audio narration
        sentiment_label:
          type: string
          nullable: true
          enum: [mostly positive, mostly frustrated, split, surprisingly calm, not enough data]
        sentiment_score:
          type: number
          nullable: true
          minimum: -1
          maximum: 1
        people_say:
          type: string
          nullable: true
          description: AI-generated social sentiment summary
        expires_at:
          type: string
        created_at:
          type: string
        saved_at:
          type: string
          nullable: true
      required:
        - id
        - title
        - category

    StoriesResponse:
      type: object
      properties:
        totalCount:
          type: integer
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
      required: [totalCount, stories]

    SearchResponse:
      type: object
      properties:
        query:
          type: string
        totalCount:
          type: integer
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
      required: [query, totalCount, stories]

    BreakingNewsResponse:
      type: object
      properties:
        breaking:
          type: object
          nullable: true
          properties:
            id:
              type: string
            headline:
              type: string
            link:
              type: string
            expires_at:
              type: string
          required: [id, headline]
      required: [breaking]

    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [email, password]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        onboarding_complete:
          type: boolean
        notification_consent:
          type: boolean
        email_verified:
          type: boolean
        created_at:
          type: string
      required: [id, email, onboarding_complete]

    SessionInfo:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
      required: [access_token]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        session:
          $ref: "#/components/schemas/SessionInfo"
      required: [user, session]

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
          nullable: true
      required: [user]

    UserPreferences:
      type: object
      properties:
        job_type:
          type: string
          nullable: true
        housing_status:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        financial_goals:
          type: array
          items:
            type: string
          nullable: true
        life_stage:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
          nullable: true
        income_bracket:
          type: string
          nullable: true

    QuizPayload:
      type: object
      properties:
        job_type:
          type: string
          nullable: true
        housing_status:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        financial_goals:
          type: array
          items:
            type: string
          nullable: true
        life_stage:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
          nullable: true
        income_bracket:
          type: string
          nullable: true

    QuizResponse:
      type: object
      properties:
        message:
          type: string
        preferences:
          $ref: "#/components/schemas/UserPreferences"
          nullable: true
      required: [preferences]

    StockPricePoint:
      type: object
      properties:
        date:
          type: string
        close:
          type: number
      required: [date, close]

    StockHistory:
      type: object
      properties:
        ticker:
          type: string
        currency:
          type: string
        range:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/StockPricePoint"
        latestPrice:
          type: number
        previousClose:
          type: number
        cachedAt:
          type: string
      required: [ticker, range, points, cachedAt]

    SimulateRequest:
      type: object
      properties:
        ticker:
          type: string
        amount:
          type: number
        startDate:
          type: string
      required: [ticker, amount, startDate]

    SimulateResponse:
      type: object
      properties:
        ticker:
          type: string
        startDate:
          type: string
        amount:
          type: number
        startPrice:
          type: number
        currentPrice:
          type: number
        sharesPurchased:
          type: number
        currentValue:
          type: number
        profitLoss:
          type: number
        percentChange:
          type: number
      required: [ticker, startDate, amount, startPrice, currentPrice, sharesPurchased, currentValue, profitLoss, percentChange]

    PushTokenRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required: [message]
